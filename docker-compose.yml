# Whole app on one machine: docker compose up --build → http://localhost:8080
# Local use only (http, dev seed allowed). Values come from .env (copy .env.example).
name: keyhaven

x-database: &database
  DATABASE_URL: postgresql://${DATABASE_USERNAME:-keyhaven}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-keyhaven}?schema=public

services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-keyhaven}
      POSTGRES_USER: ${DATABASE_USERNAME:-keyhaven}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - '${DATABASE_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Object storage for uploaded listing photos: RustFS, S3-compatible (Cloudflare R2 in production).
  storage:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${R2_ACCESS_KEY:-keyhaven}
      RUSTFS_SECRET_KEY: ${R2_SECRET_KEY:-keyhaven-local}
    ports:
      - '${STORAGE_PORT:-9000}:9000'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Creates the bucket with public reads and the browser's CORS rule, then exits
  # (backend/scripts/storage-init.ts — the same step as `make setup` runs).
  storage-init:
    build:
      context: ./backend
      target: build
    depends_on:
      storage:
        condition: service_healthy
    environment:
      R2_ENDPOINT: http://storage:9000
      R2_REGION: us-east-1
      R2_BUCKET: ${R2_BUCKET:-keyhaven}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-keyhaven}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-keyhaven-local}
      APP_URL: http://localhost:${APP_PORT:-8080}
    command: ['npx', 'tsx', 'scripts/storage-init.ts']
    restart: 'no'

  # Applies pending migrations, then exits; the backend starts after it. The same image runs the
  # seed: docker compose run --rm migrate npm run db:seed
  migrate:
    build:
      context: ./backend
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database
      APP_ENV: dev
    restart: 'no'

  backend:
    build:
      context: ./backend
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *database
      # The runtime image has no dev dependencies: JSON logs (APP_ENV=prod); the seed runs in `migrate`.
      APP_ENV: prod
      NODE_ENV: production
      PORT: '3000'
      TZ: UTC
      LOG_LEVEL: info
      SWAGGER_ENABLED: 'true'
      HTTP_BODY_LIMIT_BYTES: '1048576'
      HTTP_REQUEST_TIMEOUT_MS: '30000'
      HTTP_HEADERS_TIMEOUT_MS: '20000'
      HTTP_KEEP_ALIVE_TIMEOUT_MS: '65000'
      # Plain http on localhost: no HSTS.
      HSTS_ENABLED: 'false'
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_POOL_SIZE: '10'
      DB_QUERY_LOG: 'false'
      # nginx (frontend) sits in front.
      TRUST_PROXY_HOPS: '1'
      SESSION_COOKIE_NAME: keyhaven_session
      COOKIE_DOMAIN: ''
      # Plain http on localhost.
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      SESSION_IDLE_TIMEOUT_MINUTES: '2880'
      SESSION_ABSOLUTE_TIMEOUT_MINUTES: '10080'
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080}
      SUPPORTED_LOCALES: en
      # Emails (verification, password reset) go to the backend's log: docker compose logs backend
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Keyhaven <no-reply@keyhaven.local>}
      # The backend signs upload URLs against the host address (the browser PUTs there) and
      # reads objects inside the network; photos are served from the public bucket URL.
      R2_ENDPOINT: http://localhost:${STORAGE_PORT:-9000}
      R2_INTERNAL_ENDPOINT: http://storage:9000
      R2_REGION: us-east-1
      R2_BUCKET: ${R2_BUCKET:-keyhaven}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-keyhaven}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-keyhaven-local}
      R2_PUBLIC_URL: http://localhost:${STORAGE_PORT:-9000}/${R2_BUCKET:-keyhaven}
      # DEMO_MODE=true docker compose up → the public demo's restrictions (README → Environments).
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PROTECTED_EMAILS: ${DEMO_PROTECTED_EMAILS:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    # The landing (Astro) and the app (SPA) behind one nginx: build from the repository root.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
