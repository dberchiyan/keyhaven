# Same origin for the landing, the app and the API, so session and XSRF cookies just work (as with
# the Vite proxy). A signed-out `/` is the landing page; everything else is the app.
# Local use only (docker compose, plain http): the production server's conf is deploy/nginx/.

# No session cookie → the landing's files; a cookie (keyhaven_session, or __Host-keyhaven_session
# in production) → the app's, which then checks the session itself.
map $http_cookie $has_session {
  default                                   0;
  "~(^|;\s*)(__Host-)?keyhaven_session="   1;
}

map $has_session $home_root {
  0 /usr/share/nginx/landing;
  1 /usr/share/nginx/html;
}

# Two Content Security Policies. The app's allows inline styles: MUI (emotion) injects <style>
# elements and style attributes; img-src/connect-src http://localhost:* reach the RustFS container
# on the host's STORAGE_PORT; seed photos come from Unsplash. The landing's is strict (LD-44/45):
# its scripts and styles are files under /_landing/, its photos are built into it.
map $host $csp_app {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com http://localhost:*; font-src 'self'; connect-src 'self' http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

map $host $csp_landing {
  default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

map $has_session $csp_home {
  0 $csp_landing;
  1 $csp_app;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Security headers for every response — the landing, the app and the API alike. They live here
  # only: a location with an `add_header` of its own would drop them all, so locations set
  # `$csp` / `$cache_control` / `$vary` instead (an empty value adds no header).
  set $csp $csp_app;
  set $cache_control "";
  set $vary "";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control always;
  add_header Vary $vary always;
  # No HSTS: this server speaks plain http on localhost (the production conf sends it).

  # The landing's 404 page, served with status 404 for unknown landing paths.
  location = /404.html {
    internal;
    root /usr/share/nginx/landing;
    set $csp $csp_landing;
    set $cache_control "no-cache";
  }

  # Live events (SSE): one long response per tab — nothing buffered, no idle cut-off.
  location = /api/v1/events {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The landing page at `/` for visitors; the app for a browser that carries a session cookie.
  # The answer depends on the cookie, so no shared cache may keep it (LD-2).
  location = / {
    root $home_root;
    set $csp $csp_home;
    set $cache_control "private, no-cache";
    set $vary "Cookie";
    try_files /index.html =404;
  }

  # `/<page>.html` is the same page as `/<page>` (LD-41): one URL, a permanent redirect.
  location ~ ^/(?!index\.html$|404\.html$)(.+)\.html$ {
    return 301 /$1$is_args$args;
  }

  # The landing's prerendered pages: city pages (/rent/austin, /buy/seattle …), privacy, terms and
  # the 404 page itself; an unknown city answers the landing's 404 page with status 404.
  location ~ ^/((rent|buy)/[a-z0-9-]+|privacy|terms)$ {
    root /usr/share/nginx/landing;
    set $csp $csp_landing;
    set $cache_control "public, max-age=3600";
    error_page 404 /404.html;
    try_files $uri.html =404;
  }

  location = /404 {
    root /usr/share/nginx/landing;
    set $csp $csp_landing;
    error_page 404 /404.html;
    return 404;
  }

  # The landing's own files: hashed assets, the share images, icons, robots and the sitemaps.
  location ^~ /_landing/ {
    root /usr/share/nginx/landing;
    set $csp $csp_landing;
    set $cache_control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/og/[a-z0-9/-]+\.png$ {
    root /usr/share/nginx/landing;
    set $csp $csp_landing;
    set $cache_control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~ ^/(favicon\.svg|apple-touch-icon\.png|robots\.txt|sitemap-[a-z0-9-]+\.xml)$ {
    root /usr/share/nginx/landing;
    set $csp $csp_landing;
    set $cache_control "public, max-age=3600";
    try_files $uri =404;
  }

  # Hashed build assets never change.
  location ^~ /assets/ {
    set $cache_control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes: every other path is the app.
  location / {
    set $cache_control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
