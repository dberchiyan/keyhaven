# Same origin for the landing, the app and the API, so session and XSRF cookies just work (as with
# the Vite proxy). A signed-out `/` is the landing page; everything else is the app.
# Local use only (docker compose, plain http): the production server's conf is deploy/nginx/.

# No session cookie → the landing's files; a cookie (keyhaven_session, or __Host-keyhaven_session
# in production) → the app's, which then checks the session itself.
map $http_cookie $home_root {
  default                                   /usr/share/nginx/landing;
  "~(^|;\s*)(__Host-)?keyhaven_session="   /usr/share/nginx/html;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Security headers for every response — the landing, the app and the API alike. They live here
  # only: a location with an `add_header` of its own would drop them all, so locations set
  # `$cache_control` / `$vary` instead (an empty value adds no header).
  #   script-src 'self': neither the app nor the landing has an inline script.
  #   style-src 'unsafe-inline': MUI (emotion) injects <style> elements and style attributes.
  #   img-src/connect-src http://localhost:*: photos are read from, and uploaded (presigned PUT)
  #   to, the RustFS container on the host's STORAGE_PORT; seed photos come from Unsplash.
  set $cache_control "";
  set $vary "";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com http://localhost:*; font-src 'self'; connect-src 'self' http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control always;
  add_header Vary $vary always;
  # No HSTS: this server speaks plain http on localhost (the production conf sends it).

  # Unknown landing paths get the landing's own 404 page.
  location = /404.html {
    internal;
    root /usr/share/nginx/landing;
    set $cache_control "no-cache";
  }

  # Live events (SSE): one long response per tab — nothing buffered, no idle cut-off.
  location = /api/v1/events {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The landing page at `/` for visitors; the app for a browser that carries a session cookie.
  location = / {
    root $home_root;
    set $cache_control "no-cache";
    set $vary "Cookie";
    try_files /index.html =404;
  }

  # The landing's prerendered pages: city pages (/rent/austin, /buy/seattle …), privacy, terms.
  location ~ ^/((rent|buy)/[a-z0-9-]+|privacy|terms)$ {
    root /usr/share/nginx/landing;
    set $cache_control "public, max-age=3600";
    error_page 404 /404.html;
    try_files $uri.html =404;
  }

  # The landing's own files: hashed assets, the share image, icons, robots and the sitemap.
  location /_landing/ {
    root /usr/share/nginx/landing;
    set $cache_control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~ ^/(og\.png|favicon\.svg|apple-touch-icon\.png|robots\.txt|sitemap-[a-z0-9-]+\.xml)$ {
    root /usr/share/nginx/landing;
    set $cache_control "public, max-age=3600";
    try_files $uri =404;
  }

  # Hashed build assets never change.
  location /assets/ {
    set $cache_control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes: every other path is the app.
  location / {
    set $cache_control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
