# Same origin for the landing, the app and the API, so session and XSRF cookies just work (as with
# the Vite proxy). A signed-out `/` is the landing page; everything else is the app.

# No session cookie → the landing's files; a cookie (keyhaven_session, or __Host-keyhaven_session
# in production) → the app's, which then checks the session itself.
map $http_cookie $home_root {
  default                                   /usr/share/nginx/landing;
  "~(^|;\s*)(__Host-)?keyhaven_session="   /usr/share/nginx/html;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The landing page at `/` for visitors; the app for a browser that carries a session cookie.
  location = / {
    root $home_root;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # The landing's own files: hashed assets, the share image, icons, robots and the sitemap.
  location /_landing/ {
    root /usr/share/nginx/landing;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location ~ ^/(og\.png|favicon\.svg|apple-touch-icon\.png|robots\.txt|sitemap-[a-z0-9-]+\.xml)$ {
    root /usr/share/nginx/landing;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes: every other path is the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
